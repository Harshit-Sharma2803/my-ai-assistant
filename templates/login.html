<!DOCTYPE html>
<html>
<head>
    <title>Sign In</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            font-family: Arial, sans-serif;

            background:
                radial-gradient(
                    circle at 20% 20%,
                    rgba(99,102,241,0.30),
                    transparent 35%
                ),
                radial-gradient(
                    circle at 80% 80%,
                    rgba(139,92,246,0.25),
                    transparent 35%
                ),
                #050816;

            color: white;
        }

        .login-container {
            width: 400px;
            max-width: 90%;

            padding: 35px;

            border-radius: 24px;

            background: rgba(255,255,255,0.08);

            border: 1px solid rgba(255,255,255,0.12);

            backdrop-filter: blur(20px);

            box-shadow:
                0 25px 60px rgba(0,0,0,0.35);
        }

        .logo {
            text-align: center;
            font-size: 42px;
            margin-bottom: 10px;
        }

        h1 {
            text-align: center;
            margin: 0 0 8px;
        }

        .subtitle {
            text-align: center;
            color: #94a3b8;
            margin-bottom: 28px;
        }

        .form-group {
            margin-bottom: 18px;
        }

        label {
            display: block;
            margin-bottom: 7px;
            font-size: 14px;
        }

        input {
            width: 100%;

            padding: 13px 15px;

            border-radius: 12px;

            border: 1px solid rgba(255,255,255,0.12);

            background: rgba(255,255,255,0.08);

            color: white;

            outline: none;

            font-size: 15px;
        }

        input:focus {
            border-color: #818cf8;

            box-shadow:
                0 0 0 3px rgba(99,102,241,0.15);
        }

        input::placeholder {
            color: #94a3b8;
        }

        .login-btn {
            width: 100%;

            padding: 14px;

            margin-top: 8px;

            border: none;

            border-radius: 12px;

            background: linear-gradient(
                135deg,
                #6366f1,
                #8b5cf6
            );

            color: white;

            font-size: 15px;

            font-weight: bold;

            cursor: pointer;

            transition: 0.25s;
        }

        .login-btn:hover {
            transform: translateY(-2px);

            box-shadow:
                0 10px 25px rgba(99,102,241,0.35);
        }

        #message {
            text-align: center;
            margin-top: 15px;
            font-size: 14px;
        }

        .signup-link {
            text-align: center;

            margin-top: 22px;

            color: #94a3b8;

            font-size: 14px;
        }

        .signup-link a {
            color: #a5b4fc;

            text-decoration: none;

            font-weight: bold;
        }
        .forgot-password {
    display: block;
    text-align: right;
    margin-top: 8px;
    color: #aaa;
    font-size: 13px;
    text-decoration: none;
    transition: color 0.2s ease;
}

.forgot-password:hover {
    color: white;
}







    </style>
</head>

<body>

<div class="login-container">

    <div class="logo">🤖</div>

    <h1>Welcome Back</h1>

    <div class="subtitle">
        Sign in to your AI Assistant
    </div>

    <form id="loginForm">

        <div class="form-group">

            <label>Email</label>

            <input
                type="email"
                id="email"
                placeholder="Enter your email"
                required
            >

        </div>

        <div class="form-group">

            <label>Password</label>

            <input
                type="password"
                id="password"
                placeholder="Enter your password"
                required
            >

            <a href="/forgot-password" class="forgot-password">
    Forgot Password?
</a>

        </div>

        <button
            type="submit"
            class="login-btn"
        >
            Sign In
        </button>

    </form>

    <div id="message"></div>

    <div class="signup-link">
        Don't have an account?
        <a href="/signup">Create Account</a>
    </div>

</div>


<script>

document
    .getElementById("loginForm")
    .addEventListener("submit", async function(event) {

        event.preventDefault();

        const email =
            document.getElementById("email").value;

        const password =
            document.getElementById("password").value;

        const message =
            document.getElementById("message");

        try {

            const response = await fetch("/login", {

                method: "POST",

                headers: {
                    "Content-Type": "application/json"
                },

                body: JSON.stringify({
                    email: email,
                    password: password
                })

            });

            const data = await response.json();

            if (!response.ok) {

                message.textContent =
                    data.error || "Login failed.";

                return;
            }

            message.textContent =
                "Login successful!";

            window.location.href = "/";

        } catch (error) {

            message.textContent =
                "Something went wrong.";

            console.error(error);

        }

    });

</script>

</body>
</html>
