<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Reset Password - My AI Assistant</title>

    <style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(
                circle at top right,
                rgba(91, 45, 170, 0.35),
                transparent 40%
            ),
            radial-gradient(
                circle at bottom left,
                rgba(70, 55, 180, 0.18),
                transparent 40%
            ),
            #0b1020;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 430px;
        padding: 32px;
        background: rgba(25, 25, 50, 0.88);
        border: 1px solid rgba(130, 100, 220, 0.35);
        border-radius: 20px;
        box-shadow:
            0 0 40px rgba(100, 70, 220, 0.12),
            0 20px 50px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
    }

    h2 {
        margin-top: 0;
        text-align: center;
        font-size: 30px;
    }

    p {
        color: #aeb8d0;
        text-align: center;
        font-size: 15px;
        line-height: 1.5;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-top: 14px;
        border: 1px solid rgba(130, 140, 180, 0.3);
        border-radius: 12px;
        background: rgba(30, 35, 55, 0.9);
        color: white;
        outline: none;
        font-size: 15px;
    }

    input:focus {
        border-color: #7655ed;
        box-shadow: 0 0 12px rgba(118, 85, 237, 0.25);
    }

    button {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
            135deg,
            #6d5dfc,
            #7950e8
        );
        color: white;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        box-shadow: 0 6px 20px rgba(90, 70, 220, 0.25);
        transition: 0.2s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(90, 70, 220, 0.35);
    }

    .message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        color: #b8c2dc;
    }

    .back {
        display: block;
        margin-top: 22px;
        text-align: center;
        color: #aeb8d0;
        text-decoration: none;
        font-size: 14px;
    }

    .back:hover {
        color: white;
    }
</style>
</head>

<body>

<div class="container">

    <h2>Reset Password</h2>

    <p>
        Enter your new password below.
    </p>

    <input
        type="password"
        id="password"
        placeholder="New password"
    >

    <input
        type="password"
        id="confirm-password"
        placeholder="Confirm new password"
    >

    <button onclick="resetPassword()">
        Reset Password
    </button>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="/login"
        class="back"
    >
        ← Back to Login
    </a>

</div>

<script>

async function resetPassword() {

    const password =
        document.getElementById("password").value;

    const confirmPassword =
        document.getElementById("confirm-password").value;

    const message =
        document.getElementById("message");

    if (!password || !confirmPassword) {
        message.textContent =
            "Please fill in both fields.";
        return;
    }

    if (password !== confirmPassword) {
        message.textContent =
            "Passwords do not match.";
        return;
    }

    if (password.length < 6) {
        message.textContent =
            "Password must be at least 6 characters.";
        return;
    }

    try {

        const response = await fetch(
            "/reset-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    password: password
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Unable to reset password.";
            return;
        }

        message.textContent =
            "Password reset successfully!";

        setTimeout(() => {
            window.location.href = "/login";
        }, 1500);

    } catch (error) {

        message.textContent =
            "Something went wrong. Please try again.";

    }
}

document.getElementById("password").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        resetPassword();
    }
});

document.getElementById("confirm-password").addEventListener("keydown", function(event) {
    if (event.key === "Enter") {
        resetPassword();
    }
});

document.getElementById("password").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            resetPassword();
        }

    }
);

document.getElementById("confirm-password").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            resetPassword();
        }

    }
);

</script>

</body>
</html>
