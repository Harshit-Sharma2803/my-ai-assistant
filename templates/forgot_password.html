<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Forgot Password - My AI Assistant</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #0f0f0f;
            color: white;
            font-family: Arial, sans-serif;
        }

        .container {
            width: 90%;
            max-width: 400px;
            padding: 30px;
            background: #181818;
            border: 1px solid #333;
            border-radius: 16px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.4);
        }

        h2 {
            margin-top: 0;
            text-align: center;
        }

        p {
            color: #aaa;
            text-align: center;
            font-size: 14px;
        }

        input {
            width: 100%;
            padding: 12px;
            margin-top: 10px;
            border: 1px solid #444;
            border-radius: 8px;
            background: #101010;
            color: white;
            outline: none;
        }

        button {
            width: 100%;
            margin-top: 15px;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: white;
            color: black;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .message {
            margin-top: 15px;
            text-align: center;
            font-size: 14px;
        }

        .back {
            display: block;
            margin-top: 20px;
            text-align: center;
            color: #aaa;
            text-decoration: none;
            font-size: 13px;
        }

        .back:hover {
            color: white;
        }

        #otp-section {
            display: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h2>Forgot Password?</h2>

    <p>
        Enter your registered email address and we'll send you a verification OTP.
    </p>

    <!-- Email Section -->
    <div id="email-section">

        <input
            type="email"
            id="email"
            placeholder="Enter your email"
        >

        <button onclick="sendOTP()">
            Send OTP
        </button>

    </div>

    <!-- OTP Section -->
    <div id="otp-section">

        <input
            type="text"
            id="otp"
            placeholder="Enter 6-digit OTP"
            maxlength="6"
            inputmode="numeric"
        >

        <button onclick="verifyOTP()">
            Verify OTP
        </button>

    </div>

    <div
        id="message"
        class="message"
    ></div>

    <a
        href="/login"
        class="back"
    >
        ← Back to Login
    </a>

</div>

<style>
    * {
        box-sizing: border-box;
    }

    body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        background:
            radial-gradient(
                circle at top right,
                rgba(91, 45, 170, 0.35),
                transparent 40%
            ),
            radial-gradient(
                circle at bottom left,
                rgba(70, 55, 180, 0.18),
                transparent 40%
            ),
            #0b1020;
        color: white;
        font-family: Arial, sans-serif;
    }

    .container {
        width: 90%;
        max-width: 430px;
        padding: 32px;
        background: rgba(25, 25, 50, 0.88);
        border: 1px solid rgba(130, 100, 220, 0.35);
        border-radius: 20px;
        box-shadow:
            0 0 40px rgba(100, 70, 220, 0.12),
            0 20px 50px rgba(0, 0, 0, 0.4);
        backdrop-filter: blur(12px);
    }

    h2 {
        margin-top: 0;
        text-align: center;
        font-size: 30px;
    }

    p {
        color: #aeb8d0;
        text-align: center;
        font-size: 15px;
        line-height: 1.5;
    }

    input {
        width: 100%;
        padding: 14px;
        margin-top: 14px;
        border: 1px solid rgba(130, 140, 180, 0.3);
        border-radius: 12px;
        background: rgba(30, 35, 55, 0.9);
        color: white;
        outline: none;
        font-size: 15px;
    }

    input:focus {
        border-color: #7655ed;
        box-shadow: 0 0 12px rgba(118, 85, 237, 0.25);
    }

    button {
        width: 100%;
        margin-top: 16px;
        padding: 14px;
        border: none;
        border-radius: 12px;
        background: linear-gradient(
            135deg,
            #6d5dfc,
            #7950e8
        );
        color: white;
        cursor: pointer;
        font-weight: bold;
        font-size: 15px;
        box-shadow: 0 6px 20px rgba(90, 70, 220, 0.25);
        transition: 0.2s ease;
    }

    button:hover {
        transform: translateY(-2px);
        box-shadow: 0 8px 25px rgba(90, 70, 220, 0.35);
    }

    .message {
        margin-top: 15px;
        text-align: center;
        font-size: 14px;
        color: #b8c2dc;
    }

    .back {
        display: block;
        margin-top: 22px;
        text-align: center;
        color: #aeb8d0;
        text-decoration: none;
        font-size: 14px;
    }

    .back:hover {
        color: white;
    }

    #otp-section {
        display: none;
    }
</style>


<script>

async function sendOTP() {

    const email =
        document.getElementById("email").value.trim();

    const message =
        document.getElementById("message");

    if (!email) {
        message.textContent =
            "Please enter your email.";
        return;
    }

    try {

        const response = await fetch(
            "/forgot-password",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    email: email
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Something went wrong.";
            return;
        }

        message.textContent =
            "OTP sent to your registered email.";

        document.getElementById(
            "email-section"
        ).style.display = "none";

        document.getElementById(
            "otp-section"
        ).style.display = "block";

        document.getElementById("otp").focus();

    } catch (error) {

        message.textContent =
            "Unable to send OTP. Please try again.";

    }
}


async function verifyOTP() {

    const otp =
        document.getElementById("otp").value.trim();

    const message =
        document.getElementById("message");

    if (!otp) {
        message.textContent =
            "Please enter the OTP.";
        return;
    }

    try {

        const response = await fetch(
            "/verify-reset-otp",
            {
                method: "POST",
                headers: {
                    "Content-Type": "application/json"
                },
                body: JSON.stringify({
                    otp: otp
                })
            }
        );

        const data = await response.json();

        if (!response.ok) {
            message.textContent =
                data.error || "Invalid OTP.";
            return;
        }

        message.textContent =
            "OTP verified successfully!";

        setTimeout(() => {

            window.location.href =
                "/reset-password";

        }, 800);

    } catch (error) {

        message.textContent =
            "Unable to verify OTP.";

    }
}


/* Enter key support */

document.getElementById("email").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            sendOTP();
        }

    }
);


document.getElementById("otp").addEventListener(
    "keydown",
    function(event) {

        if (event.key === "Enter") {
            event.preventDefault();
            verifyOTP();
        }

    }
);

</script>

</body>
</html>
